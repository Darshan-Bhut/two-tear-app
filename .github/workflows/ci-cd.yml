          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Create deployment directory on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      # Copy application source to the server. The server's .env file is excluded
      # so deployment will not overwrite production secrets.
      - name: Copy application source to server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='!.env.example' \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # The Docker build happens ON THE SERVER after SSH login.
      # No Docker Hub/container-registry login is performed by this workflow.
      - name: Build and start containers on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_PATH'" <<'ENDSSH'
          set -euo pipefail
          DEPLOY_PATH="$1"

          echo "Connected to server: $(hostname)"
          echo "Deployment directory: $DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          # Confirm Docker Engine and Compose are installed.
          docker --version
          docker compose version

          # Validate the Compose configuration before changing containers.
          docker compose config --quiet

          echo "Building Docker image on the server..."
          docker compose build --pull

          echo "Starting updated containers..."
          docker compose up -d --remove-orphans

          echo "Current container status:"
          docker compose ps

          echo "Removing unused dangling images..."
          docker image prune -f

          echo "Deployment completed."
          ENDSSH

      - name: Smoke test application on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" <<'ENDSSH'
          set -euo pipefail
          APP_PORT=5000
          MAX_WAIT=60
          INTERVAL=5
          elapsed=0

          echo "Waiting for http://localhost:${APP_PORT}/health ..."
          until curl -fsS --max-time 5 \
            "http://localhost:${APP_PORT}/health" -o /dev/null; do
            if (( elapsed >= MAX_WAIT )); then
              echo "Health check failed after ${MAX_WAIT} seconds."
              docker ps -a
              docker compose logs --tail=80 || true
              exit 1
            fi
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done

          echo "Application health check passed."
          ENDSSH

      - name: Remove SSH private key
        if: always()
        run: rm -f ~/.ssh/deploy_key
