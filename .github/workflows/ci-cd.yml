name: CI/CD - Two-Tier Flask App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  dependencies:
    name: Install and cache dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies and audit tools
        run: pip install -r requirements-dev.txt flake8 pip-audit pipdeptree

      - name: Check dependency consistency
        run: pip check

      - name: Show dependency tree
        run: pipdeptree

  code-review:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt flake8

      - name: Run flake8
        run: |
          flake8 app.py tests/ \
            --max-line-length=120 \
            --extend-ignore=E501 \
            --statistics

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: code-review
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit dependencies
        run: pip install -r requirements-dev.txt pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Install Gitleaks
        run: |
          VER=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan Git history for secrets
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

      # This builds a temporary image on the GitHub runner for vulnerability scanning.
      # It does NOT log in to or push to Docker Hub/a container registry.
      - name: Build image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: two-tier-flask-app:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: two-tier-flask-app:security-scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  deploy:
    name: SSH to server, build image there, and deploy
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" ]] || { echo "::error::SSH_HOST is missing"; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo "::error::SSH_USER is missing"; exit 1; }
          [[ -n "$SSH_KEY" ]] || { echo "::error::SSH_KEY is missing"; exit 1; }
          [[ -n "$DEPLOY_PATH" ]] || { echo "::error::DEPLOY_PATH is missing"; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != "/" ]] || {
            echo "::error::DEPLOY_PATH must be an absolute path other than /"
            exit 1
          }

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Create deployment directory on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      # Copy application source to the server. The server's .env file is excluded
      # so deployment will not overwrite production secrets.
      - name: Copy application source to server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='!.env.example' \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # The Docker build happens ON THE SERVER after SSH login.
      # No Docker Hub/container-registry login is performed by this workflow.
      - name: Build and start containers on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_PATH'" <<'ENDSSH'
          set -euo pipefail
          DEPLOY_PATH="$1"

          echo "Connected to server: $(hostname)"
          echo "Deployment directory: $DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          # Confirm Docker Engine and Compose are installed.
          docker --version
          docker compose version

          # Validate the Compose configuration before changing containers.
          docker compose config --quiet

          echo "Building Docker image on the server..."
          docker compose build --pull

          echo "Starting updated containers..."
          docker compose up -d --remove-orphans

          echo "Current container status:"
          docker compose ps

          echo "Removing unused dangling images..."
          docker image prune -f

          echo "Deployment completed."
          ENDSSH

      - name: Smoke test application on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" <<'ENDSSH'
          set -euo pipefail
          APP_PORT=5000
          MAX_WAIT=60
          INTERVAL=5
          elapsed=0

          echo "Waiting for http://localhost:${APP_PORT}/health ..."
          until curl -fsS --max-time 5 \
            "http://localhost:${APP_PORT}/health" -o /dev/null; do
            if (( elapsed >= MAX_WAIT )); then
              echo "Health check failed after ${MAX_WAIT} seconds."
              docker ps -a
              docker compose logs --tail=80 || true
              exit 1
            fi
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done

          echo "Application health check passed."
          ENDSSH

      - name: Remove SSH private key
        if: always()
        run: rm -f ~/.ssh/deploy_key
